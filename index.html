<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5f5f3" />
  <title>Launchpad</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23191919' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z'/%3E%3Cpath d='m12 15-3-3a22 22 0 0 1 2-3.95A12.75 12.75 0 0 1 22 2c0 2.72-.78 7.5-6.05 11a22.35 22.35 0 0 1-3.95 2z'/%3E%3Cpath d='M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0'/%3E%3Cpath d='M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=0.4.0" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z" />
        <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.75 12.75 0 0 1 22 2c0 2.72-.78 7.5-6.05 11a22.35 22.35 0 0 1-3.95 2z" />
        <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0" />
        <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5" />
      </svg>
      <span>Launchpad</span>
    </div>
    <div class="topbar-actions">
      <label class="search-wrap" aria-label="Search bookmarks">
        <span class="search-icon">⌕</span>
        <input id="searchInput" type="search" placeholder="Search" autocomplete="off" />
      </label>
      <button id="appearanceBtn" class="icon-btn" title="Appearance" aria-label="Appearance" aria-expanded="false">Aa</button>
      <button id="themeBtn" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">◐</button>
      <div class="add-menu-wrap edit-only">
        <button id="addBtn" class="text-btn" type="button" aria-expanded="false">Add</button>
        <div id="addMenu" class="action-menu" hidden>
          <button id="addBookmarkBtn" type="button">Bookmark</button>
          <button id="addFolderBtn" type="button">Subfolder</button>
          <button id="addGroupMenuBtn" type="button">Group</button>
        </div>
      </div>
      <button id="importBtn" class="text-btn edit-only" type="button">Import</button>
      <button id="editBtn" class="text-btn" type="button">Edit</button>
    </div>
  </header>

  <main>
    <section id="board" class="board" aria-live="polite"></section>
    <div id="emptyState" class="empty-state" hidden>
      <h2>No bookmarks yet</h2>
      <p>Choose Edit, then Add to create a bookmark or group.</p>
    </div>
  </main>

  <section id="appearancePanel" class="appearance-panel" hidden aria-label="Appearance settings">
    <label>
      <span>Font</span>
      <select id="fontSelect">
        <option value="system">System</option>
        <option value="bookerly">Bookerly</option>
        <option value="ibm-plex-mono">IBM Plex Mono</option>
        <option value="ia-writer-duo">iA Writer Duo</option>
      </select>
    </label>
    <label>
      <span>Font size</span>
      <select id="fontSizeSelect">
        <option value="16">16 px</option>
        <option value="17">17 px</option>
        <option value="18">18 px</option>
        <option value="19">19 px</option>
        <option value="20">20 px</option>
        <option value="21">21 px</option>
        <option value="22">22 px</option>
        <option value="23">23 px</option>
        <option value="24">24 px</option>
      </select>
    </label>
  </section>

  <input id="importFile" type="file" accept=".html,.htm,text/html" hidden />
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="versionLabel" class="version-label" aria-label="App version">v0.4.0</div>

  <dialog id="bookmarkDialog" class="dialog">
    <form id="bookmarkForm" method="dialog">
      <div class="dialog-head">
        <h2 id="bookmarkDialogTitle">Add bookmark</h2>
        <button type="button" class="close-btn" data-close="bookmarkDialog" aria-label="Close">×</button>
      </div>
      <label>
        <span>Title</span>
        <input id="bookmarkTitle" required maxlength="120" />
      </label>
      <label>
        <span>URL</span>
        <input id="bookmarkUrl" required type="url" placeholder="https://example.com" />
      </label>
      <label id="bookmarkGroupWrap">
        <span>Location</span>
        <select id="bookmarkGroup"></select>
      </label>
      <label id="bookmarkNewGroupWrap" hidden>
        <span>New group name</span>
        <input id="bookmarkNewGroup" maxlength="60" placeholder="Bookmarks" />
      </label>
      <div class="dialog-actions bookmark-dialog-actions">
        <button id="bookmarkDeleteBtn" type="button" class="secondary-btn danger bookmark-dialog-delete" hidden>Delete</button>
        <span class="dialog-action-spacer"></span>
        <button type="button" class="secondary-btn" data-close="bookmarkDialog">Cancel</button>
        <button class="primary-btn" value="save">Save</button>
      </div>
    </form>
  </dialog>


  <dialog id="folderDialog" class="dialog small-dialog">
    <form id="folderForm" method="dialog">
      <div class="dialog-head">
        <h2 id="folderDialogTitle">Add subfolder</h2>
        <button type="button" class="close-btn" data-close="folderDialog" aria-label="Close">×</button>
      </div>
      <label>
        <span>Name</span>
        <input id="folderName" required maxlength="60" />
      </label>
      <label id="folderGroupWrap">
        <span>Group</span>
        <select id="folderGroup"></select>
      </label>
      <div class="dialog-actions bookmark-dialog-actions">
        <button id="folderDeleteBtn" type="button" class="secondary-btn danger bookmark-dialog-delete" hidden>Delete</button>
        <span class="dialog-action-spacer"></span>
        <button type="button" class="secondary-btn" data-close="folderDialog">Cancel</button>
        <button class="primary-btn" value="save">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="groupDialog" class="dialog small-dialog">
    <form id="groupForm" method="dialog">
      <div class="dialog-head">
        <h2 id="groupDialogTitle">Add group</h2>
        <button type="button" class="close-btn" data-close="groupDialog" aria-label="Close">×</button>
      </div>
      <label>
        <span>Name</span>
        <input id="groupName" required maxlength="60" />
      </label>
      <div class="dialog-actions">
        <button type="button" class="secondary-btn" data-close="groupDialog">Cancel</button>
        <button class="primary-btn" value="save">Save</button>
      </div>
    </form>
  </dialog>

  <template id="groupTemplate">
    <article class="group-card" draggable="false">
      <div class="group-header">
        <h2 class="group-title"></h2>
        <div class="group-actions edit-only">
          <button class="mini-btn rename-group" title="Rename group">Rename</button>
          <button class="mini-btn danger delete-group" title="Delete group">Delete</button>
        </div>
      </div>
      <div class="card-scroll">
        <div class="card-items"></div>
      </div>
      <div class="card-edit-footer">
        <button class="add-bookmark">+ Add bookmark</button>
        <button class="add-subfolder">+ Subfolder</button>
      </div>
    </article>
  </template>


  <template id="subfolderTemplate">
    <section class="subfolder">
      <div class="subfolder-header">
        <span class="subfolder-drag-handle edit-only" draggable="false" aria-label="Drag subfolder" title="Drag to reorder">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </span>
        <button type="button" class="subfolder-toggle" aria-expanded="true">
          <span class="subfolder-chevron" aria-hidden="true">▾</span>
          <span class="subfolder-name"></span>
          <span class="subfolder-count"></span>
        </button>
        <button type="button" class="subfolder-edit edit-only">Edit</button>
      </div>
      <div class="subfolder-content">
        <div class="bookmark-list subfolder-bookmarks"></div>
      </div>
    </section>
  </template>

  <template id="bookmarkTemplate">
    <div class="bookmark-row" draggable="false">
      <span class="bookmark-drag-handle edit-only" draggable="false" aria-label="Drag bookmark" title="Drag to reorder">
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </span>
      <a class="bookmark-link" target="_blank" rel="noopener noreferrer">
        <img class="favicon" alt="" />
        <span class="bookmark-title"></span>
      </a>
      <div class="bookmark-actions edit-only">
        <button class="bookmark-edit" title="Edit bookmark">Edit</button>
      </div>
    </div>
  </template>

  <script src="app.js?v=0.4.0"></script>
</body>
</html>
